map $http_upgrade $connection_upgrade {
	default	upgrade;
	''		close;
}

upstream api {
	server api:8000;
	keepalive 32;
}

upstream api_ws {
	server api:8000;
}

upstream web {
	server web:3000;
}

upstream grafana {
	server grafana:3000;
	keepalive 16;
}

# Per-IP rate limits, a coarse net under the per-user limits of the API
# (backend/README.md "Rate limiting"). Values are deliberately high: behind
# rootless podman every browser can reach nginx from the same address (the
# network gateway), and on a campus many students share one, so an IP is not a
# person. Over the limit: 429 in JSON, see @too_many_requests.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m  rate=100r/s;
limit_req_zone $binary_remote_addr zone=web_per_ip:10m  rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ws_per_ip:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=upload_per_ip:10m rate=60r/m;
limit_req_status 429;
limit_req_log_level warn;

server {
	listen 80;
	listen [::]:80;
	server_name _;
	return 301 https://$host:${HTTPS_PORT}$request_uri;
	# return 301 https://$host$request_uri; problem with podman rootless allowing no port under 1024
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name ${SERVER_NAME};
	# problem with podman rootless allowing no port under 1024

	ssl_certificate		/etc/nginx/certs/server.crt;
	ssl_certificate_key /etc/nginx/certs/server.key;
	ssl_protocols		TLSv1.2 TLSv1.3;
	ssl_ciphers			HIGH:!aNULL:!MD5;
	ssl_session_cache	shared:SSL:10m;
	ssl_session_timeout 1d;

	# no CSP here for efficiency
	add_header X-Content-Type-Options	"nosniff" always;
	add_header Referrer-Policy			"strict-origin-when-cross-origin" always;
	add_header Permissions-Policy		"geolocation=(), camera=(), microphone=()" always;

	client_max_body_size 10m;

	# nginx's own 429 (limit_req). The API's own 429 is proxied untouched.
	error_page 429 @too_many_requests;
	location @too_many_requests {
		default_type application/json;
		add_header Retry-After 1 always;
		return 429 '{"detail":"Too many requests, slow down"}';
	}

	location /api/ws {
		limit_req							zone=ws_per_ip burst=20 nodelay;

		proxy_pass							http://api_ws;
		proxy_http_version					1.1;

		proxy_set_header Upgrade			$http_upgrade;
		proxy_set_header Connection 		$connection_upgrade;
		proxy_set_header Host				$host;
		proxy_set_header X-Real-IP			$remote_addr;
		proxy_set_header X-Forwarded-For	$proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto	$scheme;

		proxy_read_timeout	3600s;
		proxy_send_timeout	3600s;
		proxy_buffering		off;
	}

	# Image uploads: the only /api/ route that takes a file. The API refuses more
	# than max_upload_bytes (5 MB) itself; this is the outer limit, with the
	# multipart overhead.
	location /api/v1/uploads/ {
		limit_req							zone=upload_per_ip burst=20 nodelay;
		client_max_body_size				6m;

		proxy_pass							http://api;
		proxy_http_version					1.1;

		proxy_set_header Connection			"";
		proxy_set_header Host				$host;
		proxy_set_header X-Real-IP			$remote_addr;
		proxy_set_header X-Forwarded-For	$proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto	$scheme;
	}

	# login, callback, logout: few per minute are legitimate
	location /api/auth/ {
		limit_req							zone=auth_per_ip burst=20 nodelay;
		# JSON only: the biggest legitimate body (a listing) is ~15 KB, see
		# backend/src/app/schemas/limits.py. The 10m above is for the front.
		client_max_body_size				64k;

		proxy_pass							http://api;
		proxy_http_version					1.1;

		proxy_set_header Connection			"";
		proxy_set_header Host				$host;
		proxy_set_header X-Real-IP			$remote_addr;
		proxy_set_header X-Forwarded-For	$proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto	$scheme;
	}

	location /api/ {
		limit_req							zone=api_per_ip burst=200 nodelay;
		# JSON only: the biggest legitimate body (a listing) is ~15 KB, see
		# backend/src/app/schemas/limits.py. The 10m above is for the front.
		client_max_body_size				64k;

		proxy_pass							http://api;
		proxy_http_version					1.1;

		proxy_set_header Connection			"";
		proxy_set_header Host				$host;
		proxy_set_header X-Real-IP			$remote_addr;
		proxy_set_header X-Forwarded-For	$proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto	$scheme;
	}

	location /media/ {
		alias /srv/media/;
		expires 7d;

		add_header Cache-Control "public";
		add_header Content-Disposition "attachment";

		add_header X-Content-Type-Options	"nosniff" always;
		add_header Referrer-Policy			"strict-origin-when-cross-origin" always;
		add_header Permissions-Policy		"geolocation=(), camera=(), microphone=()" always;
	}

	location / {
		limit_req							zone=web_per_ip burst=200 nodelay;

		proxy_pass							http://web;
		proxy_http_version 					1.1;

		proxy_set_header Upgrade			$http_upgrade;
		proxy_set_header Connection 		$connection_upgrade;
		# $host strips the port, but Next.js's Server Actions same-origin
		# check compares this Host header against the browser's Origin
		# (https://localhost:8443, port included) - $http_host preserves it.
		proxy_set_header Host				$http_host;
		proxy_set_header X-Real-IP			$remote_addr;
		proxy_set_header X-Forwarded-For	$proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto	$scheme;

		proxy_buffering		off;
	}

	location /_next/static/ {
		proxy_pass http://web;

		add_header Cache-Control "public, max-age=31536000, immutable";

		add_header X-Content-Type-Options	"nosniff" always;
		add_header Referrer-Policy			"strict-origin-when-cross-origin" always;
		add_header Permissions-Policy		"geolocation=(), camera=(), microphone=()" always;
	}

	location /grafana/ {
		proxy_pass							http://grafana;
		proxy_http_version					1.1;

		proxy_set_header Upgrade			$http_upgrade;
		proxy_set_header Connection 		$connection_upgrade;
		proxy_set_header Host				$host;
		proxy_set_header X-Real-IP			$remote_addr;
		proxy_set_header X-Forwarded-For	$proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto	$scheme;

		proxy_read_timeout					3600s;
		proxy_send_timeout					3600s;
		proxy_buffering						off;

		# Nested, so they inherit everything above but proxy_pass.
		# Grafana's sign-in gets the same limit as the app's.
		location = /grafana/login {
			limit_req						zone=auth_per_ip burst=20 nodelay;
			proxy_pass						http://grafana;
		}

		# Grafana's own metrics need no sign-in. GF_METRICS_ENABLED=false turns
		# them off; this keeps them unreachable if it is ever turned back on.
		location = /grafana/metrics {
			return 404;
		}
	}
}
