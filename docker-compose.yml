name: ${COMPOSE_PROJECT_NAME:-lb42}

secrets:
  POSTGRES_USER:
    file: ./secrets/POSTGRES_USER
    x-podman.relabel: z
  POSTGRES_PASSWORD:
    file: ./secrets/POSTGRES_PASSWORD
    x-podman.relabel: z
  SECRET_KEY:
    file: ./secrets/SECRET_KEY
    x-podman.relabel: z
  FT_CLIENT_ID:
    file: ./secrets/FT_CLIENT_ID
    x-podman.relabel: z
  FT_CLIENT_SECRET:
    file: ./secrets/FT_CLIENT_SECRET
    x-podman.relabel: z
  GRAFANA_USER:
    file: ./secrets/GRAFANA_USER
    x-podman.relabel: z
  GRAFANA_PASSWORD:
    file: ./secrets/GRAFANA_PASSWORD
    x-podman.relabel: z

networks:
  front:
  backend:

volumes:
  pgdata:
  media:
  certs:
  promdata:
  grafanadata:


services:
  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    secrets: [POSTGRES_USER, POSTGRES_PASSWORD]
    environment:
      POSTGRES_USER_FILE: /run/secrets/POSTGRES_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      POSTGRES_DB: ${POSTGRES_DB:-lb42db}
    volumes:
    - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/POSTGRES_USER)\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m" }

  api:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    secrets: [POSTGRES_USER, POSTGRES_PASSWORD, SECRET_KEY, FT_CLIENT_ID, FT_CLIENT_SECRET]
    environment:
      POSTGRES_USER_FILE: /run/secrets/POSTGRES_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      SECRET_KEY_FILE: /run/secrets/SECRET_KEY
      FT_CLIENT_ID_FILE: /run/secrets/FT_CLIENT_ID
      FT_CLIENT_SECRET_FILE: /run/secrets/FT_CLIENT_SECRET
      FT_REDIRECT_URI: ${FT_REDIRECT_URI:-https://localhost:8443/api/auth/callback}
      POST_LOGIN_REDIRECT: ${POST_LOGIN_REDIRECT:-/}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-lb42db}
      PGSSLMODE: ${PGSSLMODE:-disable}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      SERVER_NAME: ${SERVER_NAME:-localhost}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    volumes:
    - media:/srv/media
    networks: [backend, front]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m" }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./front
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    environment:
      API_INTERNAL_URL: http://api:8000/api/v1
    restart: unless-stopped
    depends_on: [api]
    networks: [front]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m" }

  proxy:
    init: true
    build:
      context: ./nginx
      target: runtime
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      PROJECT: ${COMPOSE_PROJECT_NAME:-lb42}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
    - certs:/etc/nginx/certs
    - media:/srv/media:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks: [front]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m" }

  prometheus:
    image: docker.io/prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro,z
      - promdata:/prometheus
    networks: [backend]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m" }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s

  grafana:
    image: docker.io/grafana/grafana:11.2.0
    restart: unless-stopped
    secrets: [GRAFANA_USER, GRAFANA_PASSWORD]
    environment:
      - GF_SECURITY_ADMIN_USER__FILE=/run/secrets/GRAFANA_USER
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/GRAFANA_PASSWORD
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Signed-out visitors do not see the version (/api/health, sign-in page)
      - GF_AUTH_ANONYMOUS_HIDE_VERSION=true
      # Grafana is only reached over HTTPS, through nginx
      - GF_SECURITY_COOKIE_SECURE=true
      # Grafana's own /metrics needs no sign-in, and nothing scrapes it
      - GF_METRICS_ENABLED=false
      # No calls home to grafana.com: usage reports, update checks
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      # The public address, the one the browser sees through nginx. Built from
      # Grafana's own protocol/domain/port, it read http://localhost:3000, and
      # Grafana Live refused its WebSocket: the browser's Origin did not match
      - GF_SERVER_ROOT_URL=https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Grafana's own home page and its news drawer fetch grafana.com's blog
      # feed, which the CSP blocks: open on the project's dashboard instead
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/fastapi_overview.json
      - GF_NEWS_NEWS_FEED_ENABLED=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - grafanadata:/var/lib/grafana
    networks: [backend, front]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m" }
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/grafana/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  postgres-exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "db:5432/${POSTGRES_DB:-lb42db}?sslmode=disable"
      DATA_SOURCE_USER_FILE: /run/secrets/POSTGRES_USER
      DATA_SOURCE_PASS_FILE: /run/secrets/POSTGRES_PASSWORD
    secrets: [POSTGRES_USER, POSTGRES_PASSWORD]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9187/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

