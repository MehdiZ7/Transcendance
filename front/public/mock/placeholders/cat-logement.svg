<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c130c" />
      <stop offset="50%" stop-color="#2a1d13" />
      <stop offset="100%" stop-color="#140d08" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)" />
  <rect width="800" height="600" fill="url(#glow)" />

  <!-- House / Logement Icon -->
  <g transform="translate(400, 260)" filter="url(#shadow)">
    <circle r="72" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <circle r="60" fill="#0f172a" stroke="#f97316" stroke-width="2" />
    
    <!-- House outline -->
    <path d="M 0 -22 L -24 0 L -18 0 L -18 20 L 18 20 L 18 0 L 24 0 Z" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linejoin="round" />
    <rect x="-6" y="6" width="12" height="14" fill="none" stroke="#94a3b8" stroke-width="2" />
    <circle cx="2" cy="13" r="1.5" fill="#f97316" />
  </g>

  <g transform="translate(400, 390)" text-anchor="middle">
    <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="1" />
    <text y="4" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">LOGEMENT</text>
  </g>

  <text x="400" y="445" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600">
    Colocation & Logement Étudiant
  </text>
  <text x="400" y="475" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14">
    Sous-locations de stages, colocs 42 & bons plans
  </text>
</svg>
