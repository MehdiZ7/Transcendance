<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120e24" />
      <stop offset="50%" stop-color="#1e173b" />
      <stop offset="100%" stop-color="#0b0817" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)" />
  <rect width="800" height="600" fill="url(#glow)" />

  <!-- Hands / Services Icon -->
  <g transform="translate(400, 260)" filter="url(#shadow)">
    <circle r="72" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <circle r="60" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
    
    <!-- Wrench / Tools / Assistance Icon -->
    <path d="M -15 -15 L -2 -2 L -6 16 L 2 24 L 24 2 L 16 -6 L -2 -2 L -15 -15 Z" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="-16" cy="-16" r="10" fill="none" stroke="#a855f7" stroke-width="2.5" />
    <circle cx="10" cy="10" r="3" fill="#94a3b8" />
  </g>

  <g transform="translate(400, 390)" text-anchor="middle">
    <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1" />
    <text y="4" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">SERVICES</text>
  </g>

  <text x="400" y="445" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600">
    Entraide & Services
  </text>
  <text x="400" y="475" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14">
    Réparation, dépannage, montage PC, design & projets
  </text>
</svg>
