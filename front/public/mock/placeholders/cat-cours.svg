<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="50%" stop-color="#162033" />
      <stop offset="100%" stop-color="#080e18" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)" />
  <rect width="800" height="600" fill="url(#glow)" />

  <!-- Book Icon -->
  <g transform="translate(400, 260)" filter="url(#shadow)">
    <circle r="72" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <circle r="60" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Open Book -->
    <path d="M 0 -12 C 12 -22 28 -20 32 -18 L 32 16 C 28 14 12 12 0 20 C -12 12 -28 14 -32 16 L -32 -18 C -28 -20 -12 -22 0 -12 Z" 
          fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
    <line x1="0" y1="-12" x2="0" y2="20" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="8" y1="-5" x2="24" y2="-3" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="3" x2="24" y2="5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="-24" y1="-3" x2="-8" y2="-5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="-24" y1="5" x2="-8" y2="3" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  </g>

  <g transform="translate(400, 390)" text-anchor="middle">
    <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
    <text y="4" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">COURS & LIVRES</text>
  </g>

  <text x="400" y="445" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600">
    Soutien, Livres & Formations
  </text>
  <text x="400" y="475" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14">
    Algorithmique, C, C++, Web, Réseau & Examens
  </text>
</svg>
