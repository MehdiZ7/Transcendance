#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#     make dev

volumes:
  web_modules:
  web_next:

services:
  db:
    restart: "no"
    ports: ["127.0.0.1:5432:5432"]

  api:
    restart: "no"
    environment:
      UVICORN_RELOAD: "true"
      SQL_ECHO: "true"
      SEED_DEMO_DATA: "true"
    volumes:
      - ./backend/src:/app/src:ro,z
    build:
      context: ./backend
      target: dev
      args:
        UID: ${UID:-1001}
        GID: ${GID:-1001}
    user: "${UID:-1001}:${GID:-1001}"
    healthcheck:
      interval: 30s

  web:
    restart: "no"
    build:
      context: ./front
      target: development
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    volumes:
    - ./front:/app:z
    - web_modules:/app/node_modules
    - web_next:/app/.next
    healthcheck:
      start_period: 120s
      interval: 10s
      retries: 12

  proxy:
    restart: "no"
    build:
      context: ./nginx
      target: runtime-dev
