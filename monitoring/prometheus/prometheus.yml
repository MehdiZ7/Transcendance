global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: "fastapi-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          application: "lb42-transcendence"
          environment: "production"

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          application: "lb42-db"
